# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: KACHELMANN MCP container image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish. Empty uses YYYY.M.D."
        required: false
        default: ""
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true

concurrency:
  group: kachelmann-mcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/safrano9999/kachelmann-mcp
      KACHELMANN_REPOSITORY: safrano9999/KACHELMANN
      KACHELMANN_REVISION: b82aad4d7a993b612abed0ecbfa40e3c311794aa
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out container repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: container
          persist-credentials: false

      - name: Check out immutable KACHELMANN source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.KACHELMANN_REPOSITORY }}
          ref: ${{ env.KACHELMANN_REVISION }}
          path: source
          persist-credentials: false

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.image_tag }}"
          if [ -z "$version" ]; then
            version="$(date -u +%Y.%-m.%-d)"
          fi
          [[ "$version" =~ ^[A-Za-z0-9_.-]+$ ]]
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "${{ inputs.push_latest }}" = true ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./container/Containerfile
          build-args: |
            KACHELMANN_SOURCE_REVISION=${{ env.KACHELMANN_REVISION }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Smoke-test published image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull "$image"
          token="$(docker run --rm \
            -e KACHELMANN_EDITOR_TOKEN=ci-editor-token \
            "$image" --print-http-token)"
          [[ "$token" == kmm1_* ]]
          docker run --rm --entrypoint python "$image" -c \
            'import psycopg; import sqlalchemy; import kachelmann.mcp_server'

          container_id="$(docker run -d --rm \
            -e KACHELMANN_DB_BACKEND=sqlite \
            -e KACHELMANN_EDITOR_TOKEN=ci-editor-token \
            -e KACHELMANN_MCP_ENABLED=true \
            -e KACHELMANN_MCP_PORT=11041 \
            "$image")"
          cleanup() {
            docker container rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" python -c \
              'from urllib.request import urlopen; urlopen("http://127.0.0.1:11041/", timeout=2).read()'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
