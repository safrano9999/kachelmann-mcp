# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Kachelmann Fedora standalone
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: KACHELMANN application revision
        default: main
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: kachelmann-standalone-release
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE_NAME: ghcr.io/safrano9999/kachelmann
    steps:
      - uses: actions/checkout@v4
        with:
          path: container
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: safrano9999/KACHELMANN
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.KACHELMANN_REPO_TOKEN }}
          path: source
          persist-credentials: false
      - name: Stage application and matching Android download
        env:
          GH_TOKEN: ${{ secrets.KACHELMANN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cp container/.github/scripts/standalone-start source/
          apk="kachelmann-$(jq -er '.version' source/release.json).apk"
          cd source
          gh api repos/safrano9999/KACHELMANN/releases/tags/latest > "$RUNNER_TEMP/kachelmann-release.json"
          for asset in "$apk" "$apk.sha256"; do
            id="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .id' "$RUNNER_TEMP/kachelmann-release.json")"
            gh api -H 'Accept: application/octet-stream' "repos/safrano9999/KACHELMANN/releases/assets/$id" > "$asset"
          done
          sha256sum -c "$apk.sha256"
      - name: Allocate next monthly registry tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api --paginate 'users/safrano9999/packages/container/kachelmann/versions?per_page=100' --jq '.[].metadata.container.tags[]' > tags 2>api-error; then
            grep -q 'HTTP 404' api-error || { cat api-error >&2; exit 1; }
            : > tags
          fi
          month="$(date -u +%Y.%m)"
          next="$(jq -Rsr --arg prefix "$month." '[split("\n")[] | select(startswith($prefix)) | ltrimstr($prefix) | select(test("^[0-9]+$")) | tonumber] | ((max // 0) + 1)' tags)"
          echo "IMAGE_TAG=$month.$next" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Fedora candidate
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./container/.github/scripts/Containerfile.standalone
          load: true
          pull: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/safrano9999/kachelmann-mcp
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
      - name: Exercise both listeners and authentication
        run: |
          set -euo pipefail
          image="$IMAGE_NAME:$IMAGE_TAG"
          docker run -d --name standalone --pull=never -p 127.0.0.1:8080:8080 -p 127.0.0.1:8000:8000 -e KACHELMANN_DB_BACKEND=sqlite -e KACHELMANN_EDITOR_TOKEN=runner-only -e KACHELMANN_DISPLAY_NAME=SUPERSPACEHUMAN "$image"
          trap 'docker logs standalone; docker rm -f standalone >/dev/null' EXIT
          for cycle in 1 2; do
            for attempt in $(seq 1 60); do
              if curl -fsS http://localhost:8080/access >page && curl -fsS http://localhost:8000/ >/dev/null; then break; fi
              sleep 1
            done
            grep -Fq '<h1>SUPERSPACEHUMAN</h1>' page
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/mcp)" = 401
            curl -fsS -H 'Authorization: Bearer runner-only' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' http://localhost:8000/mcp | grep -q serverInfo
            if [[ "$cycle" == 1 ]]; then docker restart standalone; fi
          done
      - name: Publish tested release and latest
        run: |
          set -eu
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
          echo "Published `$IMAGE_NAME:$IMAGE_TAG` and `:latest`" >> "$GITHUB_STEP_SUMMARY"
